# SUSHI configuration — Plataforma mareIA / Pathway FamilIAr_Ativa
# Implementation Guide FHIR R4 (WHO SMART Guidelines L3) para a linha de cuidado
# de telemonitoramento em cuidados paliativos domiciliares (ESAS + Zarit).
id: br.gov.mareia.familiarativa
canonical: https://mareia.saude.gov.br/ig/familiarativa
name: MareIAFamiliarAtiva
title: "mareIA — FamilIAr_Ativa (SMART Guideline para Telemonitoramento em Cuidados Paliativos Domiciliares)"
description: >-
  Implementation Guide da linha de cuidado FamilIAr_Ativa da Plataforma mareIA,
  adaptação digital (WHO SMART Guidelines L2/L3) do DAK L2 FamilIAr_Ativa
  (UFPel / CUIDATIVA / RNP) para o telemonitoramento de pacientes em cuidados
  paliativos domiciliares e seus cuidadores, com registro de sintomas (ESAS),
  avaliação de sobrecarga do cuidador (Zarit), detecção de risco por protocolo
  auditável e predição por IA com explicabilidade (XAI). Programa RNP Redes de
  Colaboração em Saúde Digital 2025.
status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build
license: CC-BY-SA-4.0
publisher:
  name: Plataforma mareIA (UFPel / CUIDATIVA / RNP — UFPE / UFPB / FATEC)
  url: https://mareia.saude.gov.br
language: pt-BR
jurisdiction: urn:iso:std:iso:3166#BR "Brazil"

dependencies:
  hl7.fhir.uv.sdc: 3.0.0       # Structured Data Capture (Questionnaire/scoring)
  hl7.fhir.uv.cpg: 1.0.0       # Clinical Practice Guidelines (PlanDefinition/Library)

